<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미디어 프로모션 위클리 브리핑</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,600;0,700;1,600&display=swap');
  :root{
    --paper:#F4F5F2; --paper-raised:#FFFFFF;
    --ink:#161D2B; --ink-soft:#4B5468; --ink-faint:#8A93A6;
    --line:#DEE1DA; --line-soft:#EAEBE6;
    --signal:#D9542F; --signal-soft:#FBEAE3;
    --teal:#0F6E63; --teal-soft:#E1F0EC;
    --gold:#9C7A1E; --gold-soft:#F5EDD9;
    --green:#2F7D4E; --green-soft:#E4F0E7;
    --serif:'Source Serif 4','Noto Serif KR',Georgia,serif;
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5;}
  .wrap{max-width:1020px;margin:0 auto;padding:36px 24px 70px;}

  /* Subject line suggestion */
  .subject-box{
    background:#fff;border:1px dashed var(--line);border-radius:10px;
    padding:12px 16px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .subject-box .lbl{font-size:11px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em;margin-bottom:3px;}
  .subject-box .txt{font-size:14px;font-weight:700;color:var(--ink);}
  .copy-btn{font-family:var(--sans);font-size:12px;padding:6px 12px;border-radius:16px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .copy-btn:hover{background:var(--ink);color:#fff;}

  /* Headline */
  .headline{border-bottom:2px solid var(--ink);padding-bottom:22px;margin-bottom:32px;}
  .headline .eyebrow{font-size:12px;color:var(--ink-faint);margin-bottom:10px;display:flex;justify-content:space-between;}
  .headline h1{font-family:var(--serif);font-weight:700;font-size:clamp(26px,4vw,36px);margin:0 0 10px;letter-spacing:-.01em;line-height:1.3;}
  .headline p{font-size:14px;color:var(--ink-soft);margin:0;}
  .headline .stat-inline{display:inline-block;background:var(--signal-soft);color:var(--signal);font-weight:700;padding:1px 7px;border-radius:4px;margin:0 2px;}

  /* Sections */
  .section{margin-bottom:40px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:6px;}
  .section-head h2{font-family:var(--serif);font-size:19px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px;}
  .section-head .count{font-size:12.5px;color:var(--ink-faint);font-weight:500;}
  .section-sub{font-size:12.5px;color:var(--ink-soft);margin:-8px 0 16px;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:760px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:520px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;
    padding:16px 16px 14px;box-shadow:0 1px 2px rgba(22,29,43,.03);
    display:flex;flex-direction:column;min-height:150px;
  }
  .card.deadline-card{border-left:3px solid var(--signal);}
  .card.update-card{border-left:3px solid var(--teal);}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px;}
  .card-media{font-weight:700;font-size:13.5px;color:var(--ink);}
  .badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap;}
  .badge.new{background:var(--signal-soft);color:var(--signal);}
  .badge.upd{background:var(--gold-soft);color:var(--gold);}
  .badge.dday{background:var(--signal);color:#fff;}
  .card-type{display:inline-block;font-size:10.5px;font-weight:600;color:var(--teal);background:var(--teal-soft);padding:2px 7px;border-radius:9px;margin-bottom:7px;align-self:flex-start;}
  .card-promo{font-size:12.5px;color:var(--ink-soft);line-height:1.5;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px;}
  .card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
  .card-period{font-size:11px;color:var(--ink-faint);}
  .card-link{font-size:11.5px;font-weight:700;color:var(--teal);text-decoration:none;background:var(--teal-soft);padding:3px 9px;border-radius:12px;}
  .card-link:hover{background:var(--teal);color:#fff;}

  .empty-note{font-size:12.5px;color:var(--ink-faint);padding:20px 4px;background:var(--paper-raised);border:1px dashed var(--line);border-radius:10px;text-align:center;}

  /* CTA */
  .cta{
    background:linear-gradient(135deg,#161D2B,#2A3547);border-radius:14px;padding:32px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;color:#fff;
  }
  .cta-text h2{font-family:var(--serif);font-size:22px;margin:0 0 6px;color:#fff;}
  .cta-text p{font-size:13px;color:#C7CBD6;margin:0;}
  .cta-btn{
    background:#fff;color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;
    padding:12px 22px;border-radius:24px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .cta-btn:hover{background:var(--paper);}

  .status-line{font-size:12px;color:var(--ink-faint);text-align:center;padding:40px 0;}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <div class="subject-box">
    <div><div class="lbl">📬 추천 메일 제목</div><div class="txt" id="subjectText">[미디어전략실] 이번 주 프로모션 업데이트 &amp; 종료임박 리스트</div></div>
    <button class="copy-btn" id="copySubject">제목 복사</button>
  </div>

  <div class="headline">
    <div class="eyebrow"><span>미디어전략실 · 위클리 브리핑</span><span id="dateLabel"></span></div>
    <h1 id="mainHeadline">불러오는 중…</h1>
    <p id="subHeadline"></p>
  </div>

  <div id="content">
    <div class="status-line">구글시트에서 최신 데이터를 불러오는 중입니다…</div>
  </div>

</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1V-wd7NNLI_5gF_HFeBqdxUb73CG0VAsSU20ORSqc8sY/gviz/tq?tqx=out:csv&gid=1871294414';
const DASHBOARD_URL = 'https://yoonmichoi79.github.io/Media-promotion-briefing/';

function escapeHtml(s){
  return (s==null ? '' : String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function normalizeLink(raw){
  const text = (raw||'').toString().trim();
  if(!text) return '';
  const m = /(https?:\/\/[^\s"'<>]+)/i.exec(text);
  if(m) return m[1];
  if(/^www\.[^\s"'<>]+\.[a-z]{2,}([/?].*)?$/i.test(text)) return 'https://' + text;
  return '';
}
function normTag(v){ v=(v||'').trim().toUpperCase(); if(v.includes('NEW')) return 'new'; if(v.includes('UPDATE')) return 'update'; return undefined; }
function normSeg(v){ v=(v||'').trim(); return v.includes('버티컬') ? 'vertical' : 'bigtech'; }
function normAud(v){ v=(v||'').trim(); return v.includes('에이전시') ? 'agency' : 'adv'; }

function rowsFromStructuredCsv(data){
  const out = [];
  data.forEach(r=>{
    const get = (k)=> r[k] ?? r[k.trim()] ?? '';
    const media = (get('매체')||'').trim();
    if(!media) return;
    out.push({
      seg: normSeg(get('세그먼트')), aud: normAud(get('대상')), media,
      type:(get('구분')||'기타').trim(), promo:(get('프로모션')||'').trim(),
      start:(get('시작일')||'').trim(), end:(get('종료일')||'').trim(), deadline:(get('신청기한')||'').trim(),
      status:(get('상태')||'진행중').trim(), updated:(get('업데이트')||'').trim(),
      tag: normTag(get('플래그')), link: normalizeLink(get('링크') || get('공지바로가기')),
    });
  });
  return out;
}
function rowsFromSectionedCsv(csvText){
  const parsed = Papa.parse(csvText, {header:false, skipEmptyLines:false});
  let seg='bigtech', aud='adv';
  let colMap = {type:3, promo:4, start:5, end:6, deadline:7, status:9, updated:10, link:11};
  const out = [];
  parsed.data.forEach(r=>{
    const c1 = (r[1]||'').toString().trim();
    const c2 = (r[2]||'').toString().trim();
    if(c2 === '매체'){
      const map = {};
      r.forEach((cell,idx)=>{
        const h=(cell||'').toString().trim();
        if(h==='구분') map.type=idx; else if(h==='프로모션') map.promo=idx;
        else if(h==='시작일') map.start=idx; else if(h==='종료일') map.end=idx;
        else if(h==='신청기한') map.deadline=idx; else if(h==='상태') map.status=idx;
        else if(h==='업데이트') map.updated=idx; else if(h==='공지바로가기'||h==='링크') map.link=idx;
      });
      colMap = {...colMap, ...map};
      return;
    }
    if(!c2){
      if(c1.includes('버티컬')) seg='vertical'; else if(c1.includes('빅테크')) seg='bigtech';
      if(c1.includes('광고주')) aud='adv'; else if(c1.includes('에이전시')) aud='agency';
      return;
    }
    const type=(r[colMap.type]||'').toString().trim();
    if(!type) return;
    out.push({
      seg, aud, media:c2, type,
      promo:(r[colMap.promo]||'').toString().trim(),
      start:(r[colMap.start]||'').toString().trim(),
      end:(r[colMap.end]||'').toString().trim(),
      deadline:(r[colMap.deadline]||'').toString().trim(),
      status:(r[colMap.status]||'').toString().trim() || '진행중',
      updated:(r[colMap.updated]||'').toString().trim(),
      tag: normTag(c1), link: normalizeLink((r[colMap.link]||'').toString().trim()),
    });
  });
  return out;
}
function rowsFromCsv(csvText){
  const structured = Papa.parse(csvText, {header:true, skipEmptyLines:true});
  const fields = (structured.meta && structured.meta.fields || []).map(f=>(f||'').trim());
  if(fields.includes('세그먼트') && fields.includes('매체')) return rowsFromStructuredCsv(structured.data);
  return rowsFromSectionedCsv(csvText);
}

function parseMD(text){
  if(!text) return null;
  const m = /(\d{1,2})\/(\d{1,2})/.exec(text);
  if(!m) return null;
  return {month:+m[1], day:+m[2]};
}
function computeDates(d){
  const s = parseMD(d.start), e = parseMD(d.end);
  const startDate = s ? new Date(2026, s.month-1, s.day) : null;
  let endDate = null;
  if(e){ endDate = new Date(2026, e.month-1, e.day); if(startDate && endDate < startDate) endDate = new Date(2027, e.month-1, e.day); }
  const dl = parseMD(d.deadline);
  const deadlineDate = dl ? new Date(2026, dl.month-1, dl.day) : null;
  return {startDate, endDate, deadlineDate};
}
function effStatus(d){
  const {startDate, endDate} = computeDates(d);
  const today = new Date(); today.setHours(0,0,0,0);
  if(endDate && today > endDate) return '종료';
  if(d.status === '진행예정' && startDate && today >= startDate && (!endDate || today <= endDate)) return '진행중';
  return d.status;
}
function ddayNum(d){
  const {endDate, deadlineDate} = computeDates(d);
  const effective = deadlineDate || endDate;
  if(!effective) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.ceil((effective - today) / 86400000);
}
function periodText(d){
  if(d.start && d.end) return `${d.start} ~ ${d.end}`;
  if(d.end) return `~ ${d.end}`;
  if(d.start) return `${d.start} ~`;
  return '-';
}

async function tryFetchOnce(url){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.text();
}
function proxyAttempts(url){
  const enc = encodeURIComponent(url);
  return [url, `https://api.allorigins.win/raw?url=${enc}`, `https://corsproxy.io/?url=${enc}`, `https://api.codetabs.com/v1/proxy?quest=${enc}`];
}
async function loadData(){
  for(const url of proxyAttempts(SHEET_URL)){
    try{
      const text = await tryFetchOnce(url);
      const rows = rowsFromCsv(text);
      if(rows.length) return rows;
    }catch(e){ continue; }
  }
  throw new Error('데이터를 불러오지 못했습니다');
}

function cardHtml(d, kind){
  const dday = ddayNum(d);
  let ddayBadge = '';
  if(kind === 'deadline' && dday != null){
    ddayBadge = `<span class="badge dday">${dday <= 0 ? 'D-DAY' : 'D-'+dday}</span>`;
  }
  let tagBadge = '';
  if(kind === 'update' && d.tag){
    tagBadge = `<span class="badge ${d.tag==='new'?'new':'upd'}">${d.tag==='new'?'NEW':'UPDATE'}</span>`;
  }
  const cardClass = kind === 'deadline' ? 'deadline-card' : 'update-card';
  return `
    <div class="card ${cardClass}">
      <div class="card-top">
        <span class="card-media">${escapeHtml(d.media)}</span>
        ${ddayBadge}${tagBadge}
      </div>
      <span class="card-type">${escapeHtml(d.type)}</span>
      <div class="card-promo">${escapeHtml(d.promo)}</div>
      <div class="card-bottom">
        <span class="card-period">${escapeHtml(periodText(d))}</span>
        ${d.link ? `<a href="${escapeHtml(d.link)}" target="_blank" rel="noopener" class="card-link">공지 보기</a>` : ''}
      </div>
    </div>`;
}

function render(data){
  const today = new Date(); today.setHours(0,0,0,0);
  const weekAgo = new Date(today.getTime() - 7*86400000);

  // 1) 이번주 업데이트: 업데이트일이 최근 7일 이내 이거나 NEW/UPDATE 플래그가 있는 항목
  const weekly = data.filter(d=>{
    if(d.tag === 'new' || d.tag === 'update') return true;
    const md = parseMD(d.updated);
    if(!md) return false;
    const dt = new Date(2026, md.month-1, md.day);
    return dt >= weekAgo && dt <= today;
  }).sort((a,b)=>{
    const ma = parseMD(a.updated), mb = parseMD(b.updated);
    const ta = ma ? new Date(2026, ma.month-1, ma.day).getTime() : 0;
    const tb = mb ? new Date(2026, mb.month-1, mb.day).getTime() : 0;
    return tb - ta;
  }).slice(0, 9);

  // 2) 종료 임박: 진행중/예정이면서 유효 마감일이 가까운 순
  const deadlineSoon = data
    .filter(d=>effStatus(d) !== '종료')
    .map(d=>({d, dday: ddayNum(d)}))
    .filter(x=>x.dday != null)
    .sort((a,b)=>a.dday-b.dday)
    .slice(0, 6)
    .map(x=>x.d);

  document.getElementById('dateLabel').textContent = today.toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'});
  document.getElementById('mainHeadline').textContent = `이번 주, 지금 챙겨야 할 프로모션 한눈에`;
  document.getElementById('subHeadline').innerHTML =
    `신규·변경 <span class="stat-inline">${weekly.length}건</span>, 종료 임박 <span class="stat-inline">${deadlineSoon.length}건</span>만 골라서 정리했습니다. 전체 목록은 아래 대시보드에서 확인하세요.`;

  const weeklySection = weekly.length ? `
    <div class="grid">${weekly.map(d=>cardHtml(d,'update')).join('')}</div>
  ` : `<div class="empty-note">이번 주 새로 등록되거나 변경된 프로모션이 없습니다.</div>`;

  const deadlineSection = deadlineSoon.length ? `
    <div class="grid">${deadlineSoon.map(d=>cardHtml(d,'deadline')).join('')}</div>
  ` : `<div class="empty-note">종료일이 임박한 진행중 프로모션이 없습니다.</div>`;

  document.getElementById('content').innerHTML = `
    <div class="section">
      <div class="section-head"><h2>🆕 이번주 프로모션 업데이트</h2><span class="count">${weekly.length}건</span></div>
      <div class="section-sub">최근 7일 내 신규 등록되었거나 내용이 바뀐 프로모션입니다.</div>
      ${weeklySection}
    </div>

    <div class="section">
      <div class="section-head"><h2>⏰ 종료일 임박 프로모션</h2><span class="count">가까운 순 ${deadlineSoon.length}건</span></div>
      <div class="section-sub">신청기한 또는 종료일이 가장 가까운 진행중 프로모션 순서입니다.</div>
      ${deadlineSection}
    </div>

    <div class="section">
      <div class="cta">
        <div class="cta-text">
          <h2>📊 전체 프로모션 대시보드</h2>
          <p>매체별·유형별 필터, 검색, 종료 임박순 정렬까지 — 전체 ${data.length}건을 한 화면에서 확인하세요.</p>
        </div>
        <a href="${DASHBOARD_URL}" target="_blank" rel="noopener" class="cta-btn">대시보드 열기 →</a>
      </div>
    </div>
  `;
}

document.getElementById('copySubject').addEventListener('click', async ()=>{
  const text = document.getElementById('subjectText').textContent;
  try{
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('copySubject');
    const old = btn.textContent; btn.textContent = '복사됨 ✓';
    setTimeout(()=>btn.textContent = old, 1500);
  }catch(e){ alert(text); }
});

(async function init(){
  try{
    const data = await loadData();
    render(data);
  }catch(e){
    document.getElementById('mainHeadline').textContent = '데이터를 불러오지 못했습니다';
    document.getElementById('subHeadline').textContent = '잠시 후 새로고침하거나, 아래 대시보드에서 직접 확인해 주세요.';
    document.getElementById('content').innerHTML = `
      <div class="section">
        <div class="cta">
          <div class="cta-text">
            <h2>📊 전체 프로모션 대시보드</h2>
            <p>실시간 데이터는 대시보드에서 바로 확인할 수 있습니다.</p>
          </div>
          <a href="${DASHBOARD_URL}" target="_blank" rel="noopener" class="cta-btn">대시보드 열기 →</a>
        </div>
      </div>`;
  }
})();
</script>
</body>
</html>
