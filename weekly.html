<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미디어 프로모션 위클리 브리핑</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
  :root{
    --ink:#161D2B; --ink-soft:#4B5468; --ink-faint:#8A93A6;
    --line:#DEE1DA; --line-soft:#EAEBE6;
    --signal:#D9542F; --signal-soft:#FDEDE6; --signal-tint:#FCE3D8;
    --teal:#0F6E63; --teal-soft:#E4F3F0; --teal-tint:#D8EFEA;
    --gold:#9C7A1E; --gold-soft:#F8F0DA;
    --green:#2F7D4E; --green-soft:#E9F5EC;
    --serif:'Nanum Gothic',sans-serif;
    --sans:'Nanum Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:transparent;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.6;}
  .wrap{max-width:680px;margin:0 auto;padding:36px 24px 70px;background:transparent;}

  /* Subject line suggestion */
  .subject-box{
    background:#FBFBFA;border:1px dashed var(--line);border-radius:10px;
    padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .subject-box .lbl{font-size:11px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em;margin-bottom:3px;}
  .subject-box .txt{font-size:14px;font-weight:700;color:var(--ink);}
  .copy-btn{font-family:var(--sans);font-size:12px;padding:6px 12px;border-radius:16px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .copy-btn:hover{background:var(--ink);color:#fff;}
  .copy-btn.primary{background:var(--ink);color:#fff;}
  .copy-btn.primary:hover{background:#2A3547;}

  /* Headline */
  .headline{margin-bottom:24px;}
  .headline h1{font-family:var(--serif);font-weight:800;margin:0 0 8px;letter-spacing:-.01em;line-height:1.3;}
  .headline p{font-size:13.5px;color:var(--ink-soft);margin:0;}
  .stat-inline{display:inline-block;background:var(--signal-soft);color:var(--signal);font-weight:700;padding:1px 7px;border-radius:4px;margin:0 2px;}

  /* Sections */
  .section{margin-bottom:40px;}
  .section-head h2{font-family:var(--serif);font-size:19px;font-weight:800;margin:0 0 4px;}
  .section-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}

  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:640px;margin:0;}
  @media(max-width:600px){ .card-grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:420px){ .card-grid{grid-template-columns:1fr;} }
  .section-frame{max-width:640px;margin:0;}

  .empty-note{font-size:12.5px;color:var(--ink-faint);padding:20px 4px;background:#FBFBFA;border:1px dashed var(--line);border-radius:10px;text-align:center;}

  /* 스크린샷 자리표시자 */
  .screenshot-slot{border:2px dashed var(--line);border-radius:12px;background:#FBFBFA;
    min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;margin-bottom:28px;color:var(--ink-faint);}
  .screenshot-slot .icon{font-size:28px;margin-bottom:8px;}
  .screenshot-slot .txt{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .screenshot-slot .sub{font-size:11.5px;margin-top:4px;}

  /* 요약 설명 */
  .summary-list{font-size:13.5px;color:var(--ink-soft);line-height:2;margin:0;padding-left:20px;}
  .summary-list li b{color:var(--ink);}
  .summary-list .stat-inline{display:inline-block;background:var(--signal-soft);color:var(--signal);font-weight:700;padding:1px 7px;border-radius:4px;margin:0 2px;}

  /* CTA */
  .cta-btn{
    background:#fff;color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;
    padding:12px 22px;border-radius:24px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .cta-btn:hover{background:#F4F5F2;}

  .status-line{font-size:12px;color:var(--ink-faint);text-align:center;padding:40px 0;}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:99;}
  .toast.show{opacity:1;}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);text-align:center;}

  #emailArea{max-width:680px;width:100%;margin:0 auto;}
</style>
</head>
<body>
<div class="wrap">

  <div class="subject-box">
    <div><div class="lbl">📬 추천 메일 제목</div><div class="txt" id="subjectText">[매체프로모션/공유] 최신 업데이트 &amp; 종료임박 리스트_9/16</div></div>
    <button class="copy-btn" id="copySubject">제목 복사</button>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
    <button class="copy-btn primary" id="selectAllBtn">본문 전체 선택</button>
  </div>

  <div id="emailArea">
    <div style="border-radius:14px;overflow:hidden;margin-bottom:24px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#161D2B" style="border:none;border-collapse:collapse;background-color:#161D2B;"><tr>
      <td bgcolor="#161D2B" style="border:none;background-color:#161D2B;padding:24px 28px;">
        <h1 id="mainHeadline" style="font-size:22px;color:#ffffff;margin:0 0 8px;font-family:'Nanum Gothic',sans-serif;font-weight:800;letter-spacing:-.01em;">불러오는 중…</h1>
        <p id="subHeadline" style="font-size:13.5px;color:#C7CBD6;margin:0;font-family:'Nanum Gothic',sans-serif;"></p>
      </td>
    </tr></table>
    </div>

    <div id="content">
      <div class="status-line">구글시트에서 최신 데이터를 불러오는 중입니다…</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div>



<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1V-wd7NNLI_5gF_HFeBqdxUb73CG0VAsSU20ORSqc8sY/gviz/tq?tqx=out:csv&gid=1871294414';
const DASHBOARD_URL = 'https://yoonmichoi79.github.io/Media-promotion-briefing/';

function escapeHtml(s){
  return (s==null ? '' : String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function normalizeLink(raw){
  const text = (raw||'').toString().trim();
  if(!text) return '';
  const m = /(https?:\/\/[^\s"'<>]+)/i.exec(text);
  if(m) return m[1];
  if(/^www\.[^\s"'<>]+\.[a-z]{2,}([/?].*)?$/i.test(text)) return 'https://' + text;
  return '';
}
function normTag(v){ v=(v||'').trim().toUpperCase(); if(v.includes('NEW')) return 'new'; if(v.includes('UPDATE')) return 'update'; return undefined; }
function normSeg(v){ v=(v||'').trim(); return v.includes('버티컬') ? 'vertical' : 'bigtech'; }
function normAud(v){ v=(v||'').trim(); return v.includes('에이전시') ? 'agency' : 'adv'; }

function rowsFromStructuredCsv(data){
  const out = [];
  data.forEach(r=>{
    const get = (k)=> r[k] ?? r[k.trim()] ?? '';
    const media = (get('매체')||'').trim();
    if(!media) return;
    out.push({
      seg: normSeg(get('세그먼트')), aud: normAud(get('대상')), media,
      type:(get('구분')||'기타').trim(), promo:(get('프로모션')||'').trim(),
      start:(get('시작일')||'').trim(), end:(get('종료일')||'').trim(), deadline:(get('신청기한')||'').trim(),
      status:(get('상태')||'진행중').trim(), updated:(get('업데이트')||'').trim(),
      tag: normTag(get('플래그')), link: normalizeLink(get('링크') || get('공지바로가기')),
    });
  });
  return out;
}
function rowsFromSectionedCsv(csvText){
  const parsed = Papa.parse(csvText, {header:false, skipEmptyLines:false});
  let seg='bigtech', aud='adv';
  let colMap = {type:3, promo:4, start:5, end:6, deadline:7, status:9, updated:10, link:11};
  const out = [];
  parsed.data.forEach(r=>{
    const c1 = (r[1]||'').toString().trim();
    const c2 = (r[2]||'').toString().trim();
    if(c2 === '매체'){
      const map = {};
      r.forEach((cell,idx)=>{
        const h=(cell||'').toString().trim();
        if(h==='구분') map.type=idx; else if(h==='프로모션') map.promo=idx;
        else if(h==='시작일') map.start=idx; else if(h==='종료일') map.end=idx;
        else if(h==='신청기한') map.deadline=idx; else if(h==='상태') map.status=idx;
        else if(h==='업데이트') map.updated=idx; else if(h==='공지바로가기'||h==='링크') map.link=idx;
      });
      colMap = {...colMap, ...map};
      return;
    }
    if(!c2){
      if(c1.includes('버티컬')) seg='vertical'; else if(c1.includes('빅테크')) seg='bigtech';
      if(c1.includes('광고주')) aud='adv'; else if(c1.includes('에이전시')) aud='agency';
      return;
    }
    const type=(r[colMap.type]||'').toString().trim();
    if(!type) return;
    out.push({
      seg, aud, media:c2, type,
      promo:(r[colMap.promo]||'').toString().trim(),
      start:(r[colMap.start]||'').toString().trim(),
      end:(r[colMap.end]||'').toString().trim(),
      deadline:(r[colMap.deadline]||'').toString().trim(),
      status:(r[colMap.status]||'').toString().trim() || '진행중',
      updated:(r[colMap.updated]||'').toString().trim(),
      tag: normTag(c1), link: normalizeLink((r[colMap.link]||'').toString().trim()),
    });
  });
  return out;
}
function rowsFromCsv(csvText){
  const structured = Papa.parse(csvText, {header:true, skipEmptyLines:true});
  const fields = (structured.meta && structured.meta.fields || []).map(f=>(f||'').trim());
  if(fields.includes('세그먼트') && fields.includes('매체')) return rowsFromStructuredCsv(structured.data);
  return rowsFromSectionedCsv(csvText);
}

function parseMD(text){
  if(!text) return null;
  const m = /(\d{1,2})\/(\d{1,2})/.exec(text);
  if(!m) return null;
  return {month:+m[1], day:+m[2]};
}
function computeDates(d){
  const s = parseMD(d.start), e = parseMD(d.end);
  const startDate = s ? new Date(2026, s.month-1, s.day) : null;
  let endDate = null;
  if(e){ endDate = new Date(2026, e.month-1, e.day); if(startDate && endDate < startDate) endDate = new Date(2027, e.month-1, e.day); }
  const dl = parseMD(d.deadline);
  const deadlineDate = dl ? new Date(2026, dl.month-1, dl.day) : null;
  return {startDate, endDate, deadlineDate};
}
function effStatus(d){
  const {startDate, endDate} = computeDates(d);
  const today = new Date(); today.setHours(0,0,0,0);
  if(endDate && today > endDate) return '종료';
  if(d.status === '진행예정' && startDate && today >= startDate && (!endDate || today <= endDate)) return '진행중';
  return d.status;
}
function ddayNum(d){
  const {endDate, deadlineDate} = computeDates(d);
  const effective = deadlineDate || endDate;
  if(!effective) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.ceil((effective - today) / 86400000);
}
function periodText(d){
  if(d.start && d.end) return `${d.start} ~ ${d.end}`;
  if(d.end) return `~ ${d.end}`;
  if(d.start) return `${d.start} ~`;
  return '-';
}

async function tryFetchOnce(url){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.text();
}
function proxyAttempts(url){
  const enc = encodeURIComponent(url);
  return [url, `https://api.allorigins.win/raw?url=${enc}`, `https://corsproxy.io/?url=${enc}`, `https://api.codetabs.com/v1/proxy?quest=${enc}`];
}
async function loadData(){
  for(const url of proxyAttempts(SHEET_URL)){
    try{
      const text = await tryFetchOnce(url);
      const rows = rowsFromCsv(text);
      if(rows.length) return rows;
    }catch(e){ continue; }
  }
  throw new Error('데이터를 불러오지 못했습니다');
}

let LAST = {weekly:[], deadlineSoon:[], data:[]};

function render(data){
  const today = new Date(); today.setHours(0,0,0,0);

  // 1) 이번주 업데이트: NEW 또는 UPDATE로 표시된 항목만
  const weekly = data.filter(d => d.tag === 'new' || d.tag === 'update');

  // 2) 종료 임박: 진행중/예정이면서 유효 마감일이 14일 이내인 항목 전부
  const deadlineSoon = data
    .filter(d=>effStatus(d) !== '종료')
    .map(d=>({d, dday: ddayNum(d)}))
    .filter(x=>x.dday != null && x.dday <= 14)
    .sort((a,b)=>a.dday-b.dday)
    .map(x=>x.d);

  const ongoing = data.filter(d=>effStatus(d) !== '종료');

  LAST = {weekly, deadlineSoon, data};

  const mm = today.getMonth()+1, dd = today.getDate();
  document.getElementById('subjectText').textContent = `[매체프로모션/공유] 최신 업데이트 & 종료임박 리스트_${mm}/${dd}`;
  document.getElementById('mainHeadline').textContent = `이번 주, 지금 챙겨야 할 프로모션 한눈에`;
  document.getElementById('subHeadline').innerHTML =
    `신규·변경 <span class="stat-inline">${weekly.length}건</span>, 종료 임박 <span class="stat-inline">${deadlineSoon.length}건</span>이 있습니다. 자세한 목록은 아래 대시보드에서 확인하세요.`;

  const nb = 'border:none;border-collapse:collapse;';
  document.getElementById('content').innerHTML = `
    <div class="screenshot-slot">
      <div class="icon">🖼️</div>
      <div class="txt">여기에 대시보드 상단 화면 캡처를 붙여넣어 주세요</div>
      <div class="sub">(브라우저에서 대시보드 상단을 캡처한 뒤, 이 영역에 이미지로 삽입)</div>
    </div>

    <div class="section">
      <div class="section-head"><h2>📋 대시보드에서 확인할 수 있는 내용</h2></div>
      <ul class="summary-list">
        <li>전체 <b>${data.length}건</b>의 매체 프로모션 진행 현황 (그 중 진행중 <b>${ongoing.length}건</b>)</li>
        <li>이번 주 신규·변경 <span class="stat-inline">${weekly.length}건</span></li>
        <li>종료임박(14일 이내) <span class="stat-inline">${deadlineSoon.length}건</span></li>
        <li>빅테크·버티컬 / 광고주·에이전시 대상별 필터, 매체명·프로모션 내용 검색</li>
        <li>기본순 · 종료 임박순 · 최근 업데이트순 정렬</li>
      </ul>
    </div>

    <div class="section">
      <div class="section-frame">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#161D2B" style="${nb}background-color:#161D2B;border-radius:14px;"><tr>
        <td bgcolor="#161D2B" style="${nb}background-color:#161D2B;padding:28px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="${nb}background-color:#161D2B;"><tr>
            <td style="${nb}background-color:#161D2B;">
              <div style="font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;">📊 전체 프로모션 대시보드</div>
              <div style="font-size:13px;color:#C7CBD6;">매체별·유형별 필터, 검색, 종료 임박순 정렬까지 — 전체 ${data.length}건을 한 화면에서 확인하세요.</div>
            </td>
            <td style="${nb}background-color:#161D2B;white-space:nowrap;" align="right" valign="middle">
              <a href="${DASHBOARD_URL}" target="_blank" rel="noopener" class="cta-btn">대시보드 열기 →</a>
            </td>
          </tr></table>
        </td>
      </tr></table>
      </div>
    </div>
  `;
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1800);
}

document.getElementById('copySubject').addEventListener('click', async ()=>{
  const text = document.getElementById('subjectText').textContent;
  try{
    await navigator.clipboard.writeText(text);
    toast('메일 제목이 복사되었습니다');
  }catch(e){ alert(text); }
});

/* 사람이 직접 드래그하면 맨 위/아래를 놓치기 쉬우므로, 본문 전체(레터헤드~푸터)를
   정확한 범위로 대신 선택해줍니다. 실제 복사는 브라우저 기본 동작인 Ctrl+C로
   사람이 직접 실행해야, 스크립트로 강제 복사할 때보다 서식(배경색 등)이 훨씬 안전하게 유지됩니다. */
document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  const area = document.getElementById('emailArea');
  const range = document.createRange();
  range.selectNodeContents(area);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  toast('본문 전체가 선택되었습니다 — Ctrl+C(맥은 Cmd+C)로 복사한 뒤 메일에 붙여넣으세요');
});

(async function init(){
  try{
    const data = await loadData();
    render(data);
  }catch(e){
    document.getElementById('mainHeadline').textContent = '데이터를 불러오지 못했습니다';
    document.getElementById('subHeadline').textContent = '잠시 후 새로고침하거나, 아래 대시보드에서 직접 확인해 주세요.';
    document.getElementById('content').innerHTML = `
      <div class="section">
        <div class="section-frame">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#161D2B" style="border:none;border-collapse:collapse;background-color:#161D2B;border-radius:14px;"><tr>
          <td style="border:none;background-color:#161D2B;padding:28px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:none;background-color:#161D2B;"><tr>
              <td style="border:none;background-color:#161D2B;">
                <div style="font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;">📊 전체 프로모션 대시보드</div>
                <div style="font-size:13px;color:#C7CBD6;">실시간 데이터는 대시보드에서 바로 확인할 수 있습니다.</div>
              </td>
              <td style="border:none;background-color:#161D2B;white-space:nowrap;" align="right" valign="middle">
                <a href="${DASHBOARD_URL}" target="_blank" rel="noopener" class="cta-btn">대시보드 열기 →</a>
              </td>
            </tr></table>
          </td>
        </tr></table>
        </div>
      </div>`;
  }
})();
</script>
</body>
</html>
